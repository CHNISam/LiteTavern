<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: iOS home-screen apps already paint under the notch and
         the home indicator, so declare it and pay the insets back with
         env(safe-area-inset-*) in CSS instead of losing the right edge. -->
    <!-- interactive-widget=resizes-content: when the soft keyboard opens, shrink the
         viewport rather than sliding the page up behind it. The default on Android
         Chrome pans the whole document, which moves the composer off the top of the
         screen the moment it gains focus — the reader is typing into a box they can
         no longer see. iOS ignores the hint and needs `visualViewport`; that is what
         `useKeyboardInset` is for. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#111421" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LiteTavern" />
    <meta name="description" content="LiteTavern — 与有记忆的角色持续对话" />
    <!--
      challenges.cloudflare.com is the Turnstile widget, and the only third-party
      origin the app talks to. It is allowed in exactly the three directives the
      challenge needs — script, frame and connect — and nowhere else: not img-src,
      not style-src, and never as a wildcard.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./litetavern.svg" />
    <title>LiteTavern</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Editable after build: points the static client at a LiteTavern Cloud origin. -->
    <script src="./litetavern-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
