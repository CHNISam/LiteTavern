name: Deploy

# 开源客户端先构建为纯静态产物，再按目标环境注入同源 Pages Worker。
# 两个 Cloudflare Pages 项目彼此隔离：
#
#   develop -> litetavern-dev  内部/开发环境，Cloudflare Access 邮箱白名单可见
# 生产只允许由 production.yml 从已发布的稳定 tag 手动部署。
#
# 两个项目都没有接 Cloudflare 的 Git 集成，部署只由本工作流触发，
# 因此"部署了什么"永远等于"这里跑过什么"。

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  # 同一分支只保留最新一次部署，旧的排队任务直接取消。
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment:
      name: internal
      url: https://litetavern-dev.pages.dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate hosted API configuration
        run: node scripts/validate-deployment-env.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          HOSTED_API_MODE: same-origin-worker
          VITE_CLOUD_BASE_URL: ${{ vars.VITE_CLOUD_BASE_URL }}

      # typecheck + lint + test + build。构建失败或测试失败都不部署。
      - name: Check and build
        run: npm run check
        env:
          # 客户端的构建时公开变量。未设置时客户端同源访问 Cloud，
          # 并保持严格的 CSP connect-src。绝不能在这里放任何密钥。
          VITE_CLOUD_BASE_URL: ''
          VITE_SUPPORT_AFDIAN_URL: ${{ vars.VITE_SUPPORT_AFDIAN_URL }}

      # 两个环境都使用同源 Pages Worker，但绑定到不同的 Cloud Worker。
      # 网关只转发 Cloud-owned 路径；它不读取 cookie，也不承载认证业务。
      - name: Add internal worker
        run: |
          cp deploy/internal-worker.js apps/web/dist/_worker.js
          cp deploy/cloud-gateway.js apps/web/dist/cloud-gateway.js
          mkdir -p apps/web/dist/internal-gate
          cp deploy/internal-gate/api.js apps/web/dist/internal-gate/api.js
          cp deploy/internal-gate/relationship-import.js apps/web/dist/internal-gate/relationship-import.js

      - name: Apply internal D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 必须固定版本。wrangler-action@v3 默认装 3.90.0，而 3.90.0 的 Pages
          # 命令不接受 JSONC 配置，会直接报
          #   Pages doesn't currently support JSON formatted config ... use wrangler.toml
          # 并在读到 wrangler.jsonc 的瞬间失败，看起来很像认证问题。
          wranglerVersion: '4.115.0'
          command: >-
            d1 migrations apply litetavern-internal
            --remote
            --config deploy/internal-gate/wrangler.jsonc

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 内部 Pages 配置只绑定 development Cloud Worker。
          wranglerVersion: '4.115.0'
          # --branch 必须与目标项目的 production_branch 一致，
          # 否则部署会落到 preview 环境，项目根地址不会更新。
          command: pages deploy --branch develop --cwd deploy/internal-gate
